name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: CMake + Ninja (MinGW)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare MinGW
        shell: pwsh
        run: |
          $found = $null
          foreach ($c in @("C:\mingw64\bin", "C:\msys64\mingw64\bin")) {
            if (Test-Path (Join-Path $c "g++.exe")) { $found = $c; break }
          }
          if (-not $found) { "MinGW not found"; exit 1 }
          "MinGW: $found"
          $env:PATH = "$found;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $found -Encoding ascii

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build 2>&1 | tail -30

      - name: Binary exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter EditorCore.exe | Select-Object -First 1
          if (-not $exe) { "EditorCore.exe was not produced"; exit 1 }
          "EditorCore.exe: {0:N0} bytes" -f $exe.Length

      # Regression guard. Two ways this project broke, both silent until a
      # clean machine tried to build:
      #   * GLEW came back (its glew-2.2.0 tag ships only glew.c.in);
      #   * FetchContent came back for glad (that tag has no src/glad.c).
      #
      # Only CODE lines are inspected. CMakeLists.txt explains in comments
      # why those fetches were removed, and those comments name the glad
      # repository. A plain substring search flagged the explanation as if
      # it were the regression.
      - name: "Regression: dependencies stayed vendored"
        shell: pwsh
        run: |
          $code = (Get-Content CMakeLists.txt |
                   Where-Object { $_ -notmatch '^\s*#' }) -join "`n"

          $bad = @()
          if ($code -match 'GLEW') { $bad += "CMakeLists.txt uses GLEW again" }
          if ($code -match 'FetchContent') { $bad += "CMakeLists.txt fetches over the network again" }

          $leaky = Get-ChildItem src -Recurse -Include *.cpp,*.h | ForEach-Object {
            if (Select-String -Path $_.FullName -Pattern 'GL/glew.h' -SimpleMatch -Quiet) {
              $_.Name
            }
          }
          if ($leaky) { $bad += "sources include GL/glew.h: $($leaky -join ', ')" }

          foreach ($dep in @('glad', 'glfw', 'imgui', 'stb')) {
            if (-not (Test-Path "third_party\$dep")) {
              $bad += "third_party/$dep is missing, offline build impossible"
            }
          }

          if ($bad.Count -gt 0) {
            "Regression:"; $bad | ForEach-Object { "  $_" }
            exit 1
          }
          "All dependencies vendored, offline build, GLEW unused."
